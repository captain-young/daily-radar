<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily-radar № {{ISSUE}} · {{DATE}}</title>

<!--
  生成后两件必做的收尾：① 删掉这段注释 ② 全文检查没有残留的 {{...}}（<title> 里也有一个）

  槽位：
    {{ISSUE}} {{DATE}} {{PH_DAY}}   期号 / 本期日期(北京) / PH 榜单日(PT)
    {{FAULT}}                       故障提示条，正常时空字符串
    {{GITHUB_ROWS}}                 GitHub 段的行
    {{PH_BRIEF}}                    PH 第 0 层「先看懂」
    {{PH_QUESTIONS}}                PH 四问
    {{SUNDAY_BLOCK}}                周日的同类对撞，其余日子空字符串
    {{ARCHIVE_LINKS}}               <a href="../YYYY-MM-DD/">MM-DD</a>，空格分隔

  GITHUB_ROWS 每个项目一块：
    <article class="repo">
      <div class="repo-top">
        <a class="repo-name" href="URL">owner/name</a><span class="delta">+1,204</span>
      </div>
      <p class="repo-meta">TypeScript · 总 34.1k · <span class="streak">连续 3 天</span></p>
      <p class="repo-note">一句中文点评。</p>
    </article>
    （streak 只在连续 ≥2 天时出现；delta 是今日涨星，不带 ★）

  PH_BRIEF —— 第 0 层，全部公开，**一个字都不涂黑**：
    <div class="brief">
      <p><span class="k">它是什么</span>中性的功能描述，说清它干什么活</p>
      <p><span class="k">给谁用</span>目标用户</p>
    </div>
    <div class="gallery">
      <figure>
        <a class="zoom" href="原图URL(不带 &w=)"><img src="…&w=800" alt=""></a>
        <figcaption>这张在演什么　<a class="zoomlink" href="原图URL(不带 &w=)">原图 ↗</a></figcaption>
      </figure>
      × 3-4 张（竖排，不要横滑）
    </div>

    **每张图都要有两个入口**：图片本身用 `<a class="zoom">` 包住，caption 末尾再加一个
    `<a class="zoomlink">原图 ↗</a>`。图片区域的点击在某些内置浏览器里不生效，
    文字链是兜底。`.evidence` 那些图同样要包，caption 没有的就在图后面单独放一行文字链。

    `src` 用 `&w=800`（省流量），`href` 用**不带 `w` 参数的原图**
    （实测原图 267KB vs w=800 的 27.8KB）。
    **不要加 `target="_blank"`** ——飞书等内置浏览器会拦掉新窗口，表现就是「点了没反应」。
    同标签跳转，返回键回来。
    <p class="ph-meta"><span class="topics">SaaS · Developer Tools</span><span class="votes">580 票</span></p>

  PH_QUESTIONS —— 四个 <section class="q">，每个三段：题面材料 / 涂黑的判定 / .more 里的展开
    <section class="q">
      <p class="q-text"><span class="q-n">①</span>问题</p>
      <div class="given">题面材料，公开。引文用 <p class="quote">…</p></div>
      <input type="checkbox" id="r1" class="reveal">
      <div class="answer">
        <p class="redact"><span class="w">判定</span><span class="w">短句</span></p>
        <div class="more">展开的理由、旁证、图片。解密前整块 display:none</div>
      </div>
      <label for="r1" class="reveal-btn">对答案</label>
    </section>
    id 用 r1…r4，周日对撞块用 r5。

  两条铁律：
    1. **每问的题面必须自带足以作答的材料**。①靠 brief 和图；②要把三层原文都列出来；
       ③要给免费额度/定价证据；④要给评论原文。缺料的问题不是训练，是蒙。
    2. **只涂黑「判定」**，材料公开、理由进 .more。解密前从头读到尾推不出判定才算对。

  涂黑分词：英文按空格切，span 间留真实空格。中文按标点切句，**标点写在 span 外面**，
  span 之间不要加空格，否则解密后中文会多出一串空格。
-->

<style>
  :root {
    --ink:     #14171A;
    --paper:   #E9E7E0;
    --paper-2: #DCD9D0;
    --rule:    #B8B4A8;
    --signal:  #2E5A4E;
    --muted:   #6B6B63;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:     #E6E4DC;
      --paper:   #16181A;
      --paper-2: #1E2124;
      --rule:    #383C40;
      --signal:  #7FB8A4;
      --muted:   #8A8E8C;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.75 var(--sans);
    -webkit-text-size-adjust: 100%;
  }
  .sheet { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem 5rem; }

  /* ── 报头 ───────────────────────────── */
  .masthead { padding: 2.5rem 0 1rem; }
  .wordmark {
    margin: 0; font-size: clamp(1.75rem, 7vw, 2.5rem);
    font-weight: 800; letter-spacing: -.04em; line-height: 1;
  }
  .issueline {
    margin: .6rem 0 0; font: 400 .75rem/1.6 var(--mono);
    color: var(--muted); letter-spacing: .02em;
  }
  .fault {
    margin: 1rem 0 0; padding: .6rem .8rem;
    border-left: 3px solid var(--signal); background: var(--paper-2);
    font: 400 .8rem/1.6 var(--mono);
  }

  /* ── 区标题 ─────────────────────────── */
  .zone-head {
    display: flex; align-items: baseline; gap: .75rem;
    margin: 0 0 1.25rem; padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font: 600 .8rem/1 var(--mono);
    letter-spacing: .14em; text-transform: uppercase;
  }
  .zone-head .cn { font-family: var(--sans); font-size: 1rem; letter-spacing: 0; }
  .zone-head .mode {
    margin-left: auto; text-transform: none; letter-spacing: 0;
    font-weight: 400; color: var(--muted); font-family: var(--sans);
  }
  .sub {
    margin: 2rem 0 1rem;
    font: 600 .7rem/1 var(--mono);
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--signal);
  }
  .sub:first-of-type { margin-top: 0; }

  /* ── 一 · GitHub ────────────────────── */
  .repo { padding: .9rem 0; border-bottom: 1px solid var(--rule); }
  .repo:last-child { border-bottom: 0; }
  .repo-top { display: flex; align-items: baseline; gap: .75rem; }
  .repo-name {
    font: 600 1.0625rem/1.4 var(--mono);
    color: var(--ink); text-decoration: none; word-break: break-all;
  }
  .repo-name:hover { color: var(--signal); text-decoration: underline; }
  .delta {
    margin-left: auto; flex: none;
    font: 600 1rem/1.4 var(--mono); color: var(--signal);
    font-variant-numeric: tabular-nums;
  }
  .repo-meta { margin: .2rem 0 0; font: 400 .75rem/1.6 var(--mono); color: var(--muted); }
  .streak { color: var(--signal); }
  .repo-note { margin: .35rem 0 0; font-size: .9375rem; }

  /* ── 二 · Product Hunt ──────────────── */
  .drill {
    margin-top: 2.5rem; padding: 1.5rem 1.25rem 2rem;
    background: var(--paper-2); border-radius: 2px;
  }
  .drill .zone-head { border-top: 0; padding-top: 0; }

  /* 第 0 层 */
  .brief { margin: 0 0 1.25rem; }
  .brief p { margin: 0 0 .6rem; font-size: .9375rem; }
  .brief .k {
    display: block;
    font: 600 .7rem/1.8 var(--mono);
    letter-spacing: .1em; color: var(--muted);
    text-transform: uppercase;
  }
  /* 竖排满宽，不做横向 carousel：横滑容器里的点击在触屏上经常被判成拖动手势，
     而且每张图只剩 82% 宽度，控制台截图的小字更读不清。竖排两个问题一起消失 */
  .gallery { margin: 0; }
  .gallery figure { margin: 0 0 1.5rem; }
  .gallery img {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--rule); border-radius: 2px;
  }
  a.zoom {
    display: block; cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }
  a.zoom:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  /* 图片本身可点，但再给一个明确的文字入口——文字链在任何环境里都点得动 */
  .zoomlink {
    white-space: nowrap; color: var(--signal); text-decoration: none;
    border-bottom: 1px solid var(--signal);
  }
  .zoomlink:hover { background: var(--signal); color: var(--paper-2); }
  .hint {
    margin: -.5rem 0 1rem;
    font: 400 .7rem/1.6 var(--mono); color: var(--muted);
  }
  .gallery figcaption {
    margin-top: .4rem; font: 400 .75rem/1.5 var(--mono); color: var(--muted);
  }
  .ph-meta {
    display: flex; gap: 1rem; align-items: baseline;
    margin: .75rem 0 0; font: 400 .75rem/1.6 var(--mono); color: var(--muted);
  }
  .ph-meta .votes {
    margin-left: auto; flex: none;
    color: var(--signal); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* 四问 */
  .q { margin: 0 0 2rem; }
  .q-text { margin: 0 0 .6rem; font-weight: 600; }
  .q-n { color: var(--signal); margin-right: .4rem; }
  .given { font-size: .9375rem; }
  .given p { margin: 0 0 .5rem; }
  /* 题面里的图只需认得出，别让它吃掉半屏；.more 里的图往往是细节图表，保持满宽。
     用 min() 兜住窄屏——写死 26rem 在 390 屏上会比容器还宽 */
  .given .evidence { max-width: min(26rem, 100%); }
  .quote {
    margin: .5rem 0; padding-left: .75rem;
    border-left: 2px solid var(--rule); color: var(--muted);
  }

  .reveal { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .answer { margin-top: .75rem; font-size: .9375rem; }
  .answer p { margin: 0 0 .5rem; }
  .answer p:last-child { margin-bottom: 0; }
  .answer .evidence {
    display: block; width: 100%; height: auto; margin: .6rem 0;
    border: 1px solid var(--rule); border-radius: 2px;
  }
  /* 展开层：解密前整块不存在。只涂黑判定不够——理由和图片本身会指向答案 */
  .answer .more { display: none; }
  .reveal:checked ~ .answer .more { display: block; }
  .redact .w {
    background: var(--ink); color: transparent; border-radius: 1px;
    /* 文字仍在 DOM 里，只是看不见——禁掉选中，免得全选或长按把答案抹出来 */
    user-select: none; -webkit-user-select: none;
    transition: background-color .18s ease, color .18s ease;
  }
  .reveal:checked ~ .answer .redact .w {
    background: transparent; color: inherit;
    user-select: auto; -webkit-user-select: auto;
  }
  .reveal-btn {
    display: inline-block; margin-top: .75rem;
    padding: .3rem .8rem;
    border: 1px solid var(--ink); border-radius: 2px;
    font: 600 .75rem/1.6 var(--mono); letter-spacing: .08em;
    cursor: pointer; user-select: none;
  }
  .reveal-btn:hover { background: var(--ink); color: var(--paper-2); }
  .reveal:focus-visible ~ .reveal-btn { outline: 2px solid var(--signal); outline-offset: 2px; }
  .reveal:checked ~ .reveal-btn { display: none; }

  /* ── 页脚 ───────────────────────────── */
  .foot {
    margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: .875rem; color: var(--muted);
  }
  .foot p { margin: 0 0 .5rem; }
  .archive { font: 400 .75rem/2 var(--mono); }
  .archive a { color: var(--muted); text-decoration: none; margin-right: .6rem; }
  .archive a:hover { color: var(--signal); text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .redact .w { transition: none; }
    .gallery { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <h1 class="wordmark">DAILY RADAR</h1>
    <p class="issueline">№ {{ISSUE}}　·　{{DATE}}　·　PH 榜单日 {{PH_DAY}} (PT)</p>
    {{FAULT}}
  </header>

  <section>
    <h2 class="zone-head"><span class="cn">一</span>GITHUB TRENDING<span class="mode">扫读</span></h2>
    {{GITHUB_ROWS}}
  </section>

  <section class="drill">
    <h2 class="zone-head"><span class="cn">二</span>PRODUCT HUNT<span class="mode">先判断，再对答案</span></h2>

    <p class="sub">0 · 先看懂</p>
    <p class="hint">图都可以点开看原图</p>
    {{PH_BRIEF}}

    <p class="sub">1 · 四问</p>
    {{PH_QUESTIONS}}
    {{SUNDAY_BLOCK}}
  </section>

  <footer class="foot">
    <p>判断完写一句预测，回复在飞书那条消息底下：<strong>「我认为它 6 个月后还在／死了，因为___」</strong>。30 天后往上翻，看命中率。</p>
    <p class="archive">往期　{{ARCHIVE_LINKS}}</p>
  </footer>

</div>
</body>
</html>
