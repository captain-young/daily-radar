<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily-radar № {{ISSUE}} · {{DATE}}</title>

<!--
  槽位（routine 填）：
    {{ISSUE}}          期号，整数
    {{DATE}}           本期日期 YYYY-MM-DD（北京）
    {{PH_DAY}}         PH 榜单日 YYYY-MM-DD（PT）
    {{FAULT}}          故障提示条，正常时填空字符串
    {{GITHUB_ROWS}}    GitHub 段的行，见下方 markup 契约
    {{PH_BLOCK}}       PH 段内容，见下方 markup 契约
    {{SUNDAY_BLOCK}}   周日的同类对撞，其余日子填空字符串
    {{ARCHIVE_LINKS}}  往期链接 <a href="../YYYY-MM-DD/">MM-DD</a>，空格分隔

  markup 契约 —— GITHUB_ROWS 每个项目一块：
    <article class="repo">
      <div class="repo-top">
        <a class="repo-name" href="URL">owner/name</a>
        <span class="delta">+1,204</span>
      </div>
      <p class="repo-meta">TypeScript · 总 34.1k · <span class="streak">连续 3 天</span></p>
      <p class="repo-note">一句中文点评。</p>
    </article>
    （streak 那个 span 只在连续 ≥2 天时出现；delta 是今日涨星，不带 ★）

  markup 契约 —— PH_BLOCK：
    <img class="hero" src="…&w=800" alt="Product Hunt 首屏图">
    <p class="ph-meta"><span class="topics">SaaS · Developer Tools</span><span class="votes">580 票</span></p>
    然后四个 <section class="q">…</section>，每个都是**两层**：
    <section class="q">
      <p class="q-text"><span class="q-n">①</span>它堵的是哪两个动作之间的缝？</p>
      <input type="checkbox" id="r1" class="reveal">
      <div class="answer">
        <p class="redact"><span class="w">结论</span><span class="w">短句</span></p>
        <div class="more">
          引文、旁证、分析、图片 —— 解密前整块 display:none
          <p class="quote">…</p>
          <img class="evidence" src="…" alt="…">
        </div>
      </div>
      <label for="r1" class="reveal-btn">解密</label>
    </section>
    id 用 r1…r4，周日对撞块用 r5。

    **只有结论放 .redact，其余一律放 .more。** 涂黑只挡住结论、把引文和图片留在外面，
    等于白给答案——实测 ② 的品牌封面图印着 tagline，解密前就能看到，整题作废。

    .hero 必须是**产品界面截图**，不能是带 logo + 标语的品牌封面图——封面图会直接泄露
    tagline，把整个「先猜」机制废掉。品牌封面图放进 ② 的 .answer 里当「首图」那层的证据：
      <img class="evidence" src="…&w=800" alt="品牌封面图">

    涂黑规则：.redact 里每段包一个 <span class="w">。
      英文——按空格切词，span 之间保留真实空格
      中文——按标点切成短句，**标点写在 span 外面**（标点可见，天然把条子分开），
             span 之间不要加空格，否则解密后中文里会多出一串空格
    不需要涂黑的说明性文字直接写在 .answer 里、不加 .redact。
-->

<style>
  :root {
    --ink:     #14171A;
    --paper:   #E9E7E0;
    --paper-2: #DCD9D0;
    --rule:    #B8B4A8;
    --signal:  #2E5A4E;
    --muted:   #6B6B63;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:     #E6E4DC;
      --paper:   #16181A;
      --paper-2: #1E2124;
      --rule:    #383C40;
      --signal:  #7FB8A4;
      --muted:   #8A8E8C;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.75 var(--sans);
    -webkit-text-size-adjust: 100%;
  }
  .sheet { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem 5rem; }

  /* ── 报头 ───────────────────────────── */
  .masthead { padding: 2.5rem 0 1rem; }
  .wordmark {
    margin: 0;
    font-size: clamp(1.75rem, 7vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -.04em;
    line-height: 1;
  }
  .issueline {
    margin: .6rem 0 0;
    font: 400 .75rem/1.6 var(--mono);
    color: var(--muted);
    letter-spacing: .02em;
  }
  .fault {
    margin: 1rem 0 0;
    padding: .6rem .8rem;
    border-left: 3px solid var(--signal);
    background: var(--paper-2);
    font: 400 .8rem/1.6 var(--mono);
  }

  /* ── 区标题 ─────────────────────────── */
  .zone-head {
    display: flex; align-items: baseline; gap: .75rem;
    margin: 0 0 1.25rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font: 600 .8rem/1 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .zone-head .cn { font-family: var(--sans); font-size: 1rem; letter-spacing: 0; }
  .zone-head .mode {
    margin-left: auto; text-transform: none; letter-spacing: 0;
    font-weight: 400; color: var(--muted); font-family: var(--sans);
  }

  /* ── 一 · GitHub ────────────────────── */
  .repo { padding: .9rem 0; border-bottom: 1px solid var(--rule); }
  .repo:last-child { border-bottom: 0; }
  .repo-top { display: flex; align-items: baseline; gap: .75rem; }
  .repo-name {
    font: 600 1.0625rem/1.4 var(--mono);
    color: var(--ink); text-decoration: none;
    word-break: break-all;
  }
  .repo-name:hover { color: var(--signal); text-decoration: underline; }
  .delta {
    margin-left: auto; flex: none;
    font: 600 1rem/1.4 var(--mono);
    color: var(--signal);
    font-variant-numeric: tabular-nums;
  }
  .repo-meta {
    margin: .2rem 0 0;
    font: 400 .75rem/1.6 var(--mono);
    color: var(--muted);
  }
  .streak { color: var(--signal); }
  .repo-note { margin: .35rem 0 0; font-size: .9375rem; }

  /* ── 二 · Product Hunt ──────────────── */
  .drill {
    margin-top: 2.5rem;
    padding: 1.5rem 1.25rem 2rem;
    background: var(--paper-2);
    border-radius: 2px;
  }
  .drill .zone-head { border-top: 0; padding-top: 0; }
  .hero {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--rule); border-radius: 2px;
  }
  .ph-meta {
    display: flex; gap: 1rem; align-items: baseline;
    margin: .75rem 0 2rem;
    font: 400 .75rem/1.6 var(--mono);
    color: var(--muted);
  }
  .ph-meta .votes {
    margin-left: auto; flex: none;
    color: var(--signal); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .q { margin: 0 0 1.75rem; }
  .q-text { margin: 0 0 .6rem; font-weight: 600; }
  .q-n { color: var(--signal); margin-right: .4rem; }

  /* 涂黑：条宽就是真实文字宽度 */
  .reveal { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .answer { font-size: .9375rem; }
  .answer p { margin: 0 0 .5rem; }
  .answer p:last-child { margin-bottom: 0; }
  .answer .quote {
    margin: .5rem 0; padding-left: .75rem;
    border-left: 2px solid var(--rule); color: var(--muted);
  }
  .answer .evidence {
    display: block; width: 100%; height: auto; margin: .6rem 0;
    border: 1px solid var(--rule); border-radius: 2px;
  }
  /* 证据层：解密前整块不存在。只涂黑结论是不够的——引文、图片、旁证本身就是答案 */
  .answer .more { display: none; }
  .reveal:checked ~ .answer .more { display: block; }
  .redact .w {
    background: var(--ink); color: transparent;
    border-radius: 1px;
    /* 文字仍在 DOM 里，只是看不见——禁掉选中，免得全选或长按把答案抹出来 */
    user-select: none; -webkit-user-select: none;
    transition: background-color .18s ease, color .18s ease;
  }
  .reveal:checked ~ .answer .redact .w {
    background: transparent; color: inherit;
    user-select: auto; -webkit-user-select: auto;
  }

  .reveal-btn {
    display: inline-block; margin-top: .75rem;
    padding: .3rem .8rem;
    border: 1px solid var(--ink); border-radius: 2px;
    font: 600 .75rem/1.6 var(--mono);
    letter-spacing: .08em;
    cursor: pointer; user-select: none;
  }
  .reveal-btn:hover { background: var(--ink); color: var(--paper-2); }
  .reveal:focus-visible ~ .reveal-btn { outline: 2px solid var(--signal); outline-offset: 2px; }
  .reveal:checked ~ .reveal-btn { display: none; }

  /* ── 页脚 ───────────────────────────── */
  .foot {
    margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: .875rem; color: var(--muted);
  }
  .foot p { margin: 0 0 .5rem; }
  .archive { font: 400 .75rem/2 var(--mono); }
  .archive a { color: var(--muted); text-decoration: none; margin-right: .6rem; }
  .archive a:hover { color: var(--signal); text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .redact .w { transition: none; }
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <h1 class="wordmark">DAILY RADAR</h1>
    <p class="issueline">№ {{ISSUE}}　·　{{DATE}}　·　PH 榜单日 {{PH_DAY}} (PT)</p>
    {{FAULT}}
  </header>

  <section>
    <h2 class="zone-head"><span class="cn">一</span>GITHUB TRENDING<span class="mode">扫读</span></h2>
    {{GITHUB_ROWS}}
  </section>

  <section class="drill">
    <h2 class="zone-head"><span class="cn">二</span>PRODUCT HUNT<span class="mode">先猜，再解密</span></h2>
    {{PH_BLOCK}}
    {{SUNDAY_BLOCK}}
  </section>

  <footer class="foot">
    <p>猜完了写一句预测，回复在飞书那条消息底下：<strong>「我认为它 6 个月后还在／死了，因为___」</strong>。30 天后往上翻，看命中率。</p>
    <p class="archive">往期　{{ARCHIVE_LINKS}}</p>
  </footer>

</div>
</body>
</html>
