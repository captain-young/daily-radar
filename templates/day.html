<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daily-radar № {{ISSUE}} · {{DATE}}</title>

<!--
  生成后两件必做的收尾：① 删掉这段注释 ② 全文检查没有残留的 {{...}}（<title> 里也有一个）

  槽位：
    {{ISSUE}} {{DATE}} {{PH_DAY}}   期号 / 本期日期(北京) / PH 榜单日(PT)
    {{FAULT}}                       故障提示条，正常时空字符串
    {{GITHUB_ROWS}}                 GitHub 段的行
    {{PH_BRIEF}}                    PH 第 0 层「先看懂」
    {{PH_QUESTIONS}}                PH 四问
    {{SUNDAY_BLOCK}}                周日的同类对撞，其余日子空字符串
    {{ARCHIVE_LINKS}}               <a href="../YYYY-MM-DD/">MM-DD</a>，空格分隔

  ── 为什么是标签页而不是上下两段 ──
  GitHub Trending 和 Product Hunt 是**两件无关的事**，阅读模式也不同（扫读 vs 精拆）。
  上下排版会暗示先后和层级，让 GitHub 段变成「翻过去才能开始训练」的前言。
  标签页让两者平级，各自独立。默认落在 PRODUCT HUNT——那是这个项目存在的理由。

  {{GH_SUMMARY}} —— 一到两句，说清今天这一榜的构成/规律（例：AI 相关占三席，
    另外两席是把重型桌面软件搬进浏览器和唯一的十五年老项目）。不要写「值得开发者重点关注」。

  GITHUB_ROWS 每个项目一块，**三段式**：
    <article class="repo">
      <div class="repo-top">
        <a class="repo-name" href="URL">owner/name</a><span class="delta">+1,204</span>
      </div>
      <p class="repo-meta">TypeScript · 总 34.1k · 建库 2024-12 · <span class="streak">连续 3 天</span></p>
      <dl class="repo-note">
        <dt>项目定位</dt><dd>一句话说清它是什么、给谁用</dd>
        <dt>核心功能</dt><dd>**具体到技术栈和能力清单**，必须来自 README</dd>
        <dt>值得关注</dt><dd>这个项目上有什么别人不会注意到的东西</dd>
      </dl>
    </article>
    streak 只在连续 ≥2 天时出现。

    「核心功能」必须**读过 README 再写**，具体到技术选型和能力清单——
    「基于 Tauri + MapLibre + DuckDB-WASM，支持 3D 可视化、SQL 空间分析」这种密度才算合格，
    「功能强大、生态丰富」这种一律不要。

    「值得关注」写**从 README 里挖出来、扫榜看不到的东西**。三个真实例子：
      · aisuite 的桌面产品 OpenWorker 已拆到独立仓库，README 标注 `platform/` 将来会删——
        等于它正在把自己收回成纯底层库
      · ECC 建库半年 23.5 万星 3.6 万 fork，和 6 个月年龄对不上；README 顶部还挂着
        「只从官方渠道安装，第三方镜像可能带恶意代码」的警告
      · Jenkins 是榜上唯一的十五年老项目，+180 对 26k star 的老库是日常波动，
        看不出特别动作——**没查清就说没查清，不要替它编一个上榜理由**

  PH_BRIEF —— 第 0 层，全部公开，**一个字都不涂黑**：
    <div class="brief">
      <p><span class="k">它是什么</span>中性的功能描述，说清它干什么活</p>
      <p><span class="k">给谁用</span>目标用户</p>
    </div>
    <div class="gallery">
      <figure>
        <label class="zoom" for="z1"><img src="…&w=800" alt=""></label>
        <figcaption>这张在演什么　<a class="zoomlink" href="原图URL(不带 &w=)">原图 ↗</a></figcaption>
      </figure>
      <input type="checkbox" id="z1" class="lb-toggle">
      <div class="lb">
        <div class="lb-bar">
          <label class="x" for="z1">✕ 关闭</label>
          <span class="tip">要逐像素看点右边</span>
          <a href="原图URL(不带 &w=)">原图 ↗</a>
        </div>
        <div class="lb-scroll"><img src="…&w=1600" alt=""></div>
      </div>
      × 3-4 张（竖排，不要横滑）
    </div>
    <p class="ph-meta"><span class="topics">SaaS · Developer Tools</span><span class="votes">580 票</span></p>

    **每张图三个入口**，前两个不离开页面：
      ① 点图 → 站内浮层，**fit-to-screen 居中，整张放得下、不用拖**
      ② 顶栏「✕ 关闭」→ 滚动位置和已解密状态都不丢
      ③ 「原图 ↗」→ 逐像素看时才跳走，手机上给的是原生捏合缩放
    `id` 用 `z1…z5`，别和解密的 `r1…r4` 撞。`<input>` 必须是 `.lb` 的**前置兄弟**。
    尺寸：内联 `&w=800` / 浮层 `&w=1600` / 文字链原图。
    **不要加 `target="_blank"`** ——飞书等内置浏览器会拦新窗口，症状是「点了没反应」。

  PH_QUESTIONS —— 四个 <section class="q">，每个三段：题面材料 / 涂黑的判定 / .more 里的展开
    <section class="q">
      <p class="q-text"><span class="q-n">①</span>问题</p>
      <div class="given">题面材料，公开。引文用 <p class="quote">…</p></div>
      <input type="checkbox" id="r1" class="reveal">
      <div class="answer">
        <p class="redact"><span class="w">判定</span><span class="w">短句</span></p>
        <div class="more">展开的理由、旁证、图片。解密前整块 display:none</div>
      </div>
      <label for="r1" class="reveal-btn">对答案</label>
    </section>

  两条铁律：
    1. **每问的题面必须自带足以作答的材料**。①靠 brief 和图；②要把三层原文都列出来；
       ③要给免费额度/定价证据；④要给评论原文。缺料的问题不是训练，是蒙
    2. **只涂黑「判定」**，材料公开、理由进 .more。解密前从头读到尾推不出判定才算对

  涂黑分词：英文按空格切，span 间留真实空格。中文按标点切句，**标点写在 span 外面**，
  span 之间不要加空格，否则解密后中文会多出一串空格。
-->

<style>
  :root {
    --ink:     #14171A;
    --paper:   #E9E7E0;
    --paper-2: #DCD9D0;
    --rule:    #B8B4A8;
    --signal:  #2E5A4E;
    --muted:   #6B6B63;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:     #E6E4DC;
      --paper:   #16181A;
      --paper-2: #1E2124;
      --rule:    #383C40;
      --signal:  #7FB8A4;
      --muted:   #8A8E8C;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.75 var(--sans);
    -webkit-text-size-adjust: 100%;
  }
  .sheet { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem 5rem; }

  /* ── 报头 ───────────────────────────── */
  .masthead { padding: 2.5rem 0 1rem; }
  .wordmark {
    margin: 0; font-size: clamp(1.75rem, 7vw, 2.5rem);
    font-weight: 800; letter-spacing: -.04em; line-height: 1;
  }
  .issueline {
    margin: .6rem 0 0; font: 400 .75rem/1.6 var(--mono);
    color: var(--muted); letter-spacing: .02em;
  }
  .fault {
    margin: 1rem 0 0; padding: .6rem .8rem;
    border-left: 3px solid var(--signal); background: var(--paper-2);
    font: 400 .8rem/1.6 var(--mono);
  }

  /* ── 标签页：两件无关的事，平级 ─────── */
  .tab-in { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .tabs {
    display: flex; gap: 1.5rem;
    margin: 1.5rem 0 1.5rem;
    border-bottom: 1px solid var(--rule);
  }
  .tabs label {
    padding: .5rem 0; margin-bottom: -1px;
    border-bottom: 2px solid transparent;
    font: 600 .75rem/1.4 var(--mono);
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tabs label:hover { color: var(--ink); }
  .tabs .n { font-weight: 400; opacity: .7; }
  .pane { display: none; }
  #tab-ph:checked ~ .tabs label[for="tab-ph"],
  #tab-gh:checked ~ .tabs label[for="tab-gh"] {
    color: var(--ink); border-bottom-color: var(--signal);
  }
  #tab-ph:checked ~ .pane-ph, #tab-gh:checked ~ .pane-gh { display: block; }
  #tab-ph:focus-visible ~ .tabs label[for="tab-ph"],
  #tab-gh:focus-visible ~ .tabs label[for="tab-gh"] {
    outline: 2px solid var(--signal); outline-offset: 2px;
  }
  .pane-head {
    margin: 0 0 1.25rem;
    font: 400 .8125rem/1.6 var(--sans); color: var(--muted);
  }

  /* ── GitHub Trending ────────────────── */
  .repo { padding: 1rem 0; border-bottom: 1px solid var(--rule); }
  .repo:last-child { border-bottom: 0; }
  .repo-top { display: flex; align-items: baseline; gap: .75rem; }
  .repo-name {
    font: 600 1.0625rem/1.4 var(--mono);
    color: var(--ink); text-decoration: none; word-break: break-all;
  }
  .repo-name:hover { color: var(--signal); text-decoration: underline; }
  .delta {
    margin-left: auto; flex: none;
    font: 600 1rem/1.4 var(--mono); color: var(--signal);
    font-variant-numeric: tabular-nums;
  }
  .repo-meta { margin: .2rem 0 0; font: 400 .75rem/1.6 var(--mono); color: var(--muted); }
  .streak { color: var(--signal); }
  .repo-note { margin: .6rem 0 0; font-size: .9375rem; }
  .repo-note dt {
    font: 600 .7rem/1.8 var(--mono);
    letter-spacing: .1em; color: var(--muted);
    text-transform: uppercase;
  }
  .repo-note dd { margin: 0 0 .5rem; }
  .repo-note dd:last-child { margin-bottom: 0; }

  /* ── Product Hunt ───────────────────── */
  .drill {
    padding: 1.5rem 1.25rem 2rem;
    background: var(--paper-2); border-radius: 2px;
  }
  .sub {
    margin: 2rem 0 1rem;
    font: 600 .7rem/1 var(--mono);
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--signal);
  }
  .sub:first-child { margin-top: 0; }

  .brief { margin: 0 0 1.25rem; }
  .brief p { margin: 0 0 .6rem; font-size: .9375rem; }
  .brief .k {
    display: block;
    font: 600 .7rem/1.8 var(--mono);
    letter-spacing: .1em; color: var(--muted);
    text-transform: uppercase;
  }

  /* 竖排满宽，不做横向 carousel：横滑容器里的点击在触屏上常被判成拖动手势，
     而且每张图只剩 82% 宽度，控制台截图的小字更读不清 */
  .gallery { margin: 0; }
  .gallery figure { margin: 0 0 1.5rem; }
  .gallery img {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--rule); border-radius: 2px;
  }
  .gallery figcaption {
    margin-top: .4rem; font: 400 .75rem/1.5 var(--mono); color: var(--muted);
  }
  .ph-meta {
    display: flex; gap: 1rem; align-items: baseline;
    margin: .75rem 0 0; font: 400 .75rem/1.6 var(--mono); color: var(--muted);
  }
  .ph-meta .votes {
    margin-left: auto; flex: none;
    color: var(--signal); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* 点图开站内浮层，不跳走——跳走会丢掉滚动位置和已解密的状态 */
  label.zoom {
    display: block; cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }
  .lb-toggle { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .lb { display: none; }
  /* 必须用相邻兄弟 + 而不是 ~：.lb 全都是 .gallery 的同级子元素，
     用 ~ 会一次显示后面所有浮层，最后一个盖在最上面，点第一张却看到第三张 */
  .lb-toggle:checked + .lb {
    display: block;
    position: fixed; inset: 0; z-index: 50;
    background: #0B0D0EF2;
  }
  /* 整张放得下、不用拖：fit-to-screen 居中。
     真要逐像素看走顶栏的「原图 ↗」，手机上那条给的是原生捏合缩放 */
  .lb-scroll {
    position: absolute; inset: 3rem 0 0;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem; overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .lb-scroll img {
    display: block; width: auto; height: auto;
    max-width: 100%; max-height: calc(100vh - 5rem);
    object-fit: contain;
  }
  .lb-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 3rem;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1rem; gap: 1rem;
    background: #0B0D0E; color: #E6E4DC;
    font: 600 .75rem/1 var(--mono); letter-spacing: .06em;
  }
  .lb-bar .x { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .lb-bar .tip { font-weight: 400; opacity: .6; letter-spacing: 0; }
  .lb-bar a { color: #7FB8A4; text-decoration: none; border-bottom: 1px solid #7FB8A4; }
  body:has(.lb-toggle:checked) { overflow: hidden; }
  /* 键盘走 caption 里的 .zoomlink（真 <a>，原生可聚焦）；
     图片上的 label 是鼠标/触屏入口，不做焦点样式 */
  .zoomlink {
    white-space: nowrap; color: var(--signal); text-decoration: none;
    border-bottom: 1px solid var(--signal);
  }
  .zoomlink:hover { background: var(--signal); color: var(--paper-2); }

  /* 四问 */
  .q { margin: 0 0 2rem; }
  .q-text { margin: 0 0 .6rem; font-weight: 600; }
  .q-n { color: var(--signal); margin-right: .4rem; }
  .given { font-size: .9375rem; }
  .given p { margin: 0 0 .5rem; }
  /* 题面里的图只需认得出；用 min() 兜住窄屏，写死 26rem 在 390 屏上比容器还宽 */
  .given .evidence { max-width: min(26rem, 100%); }
  .quote {
    margin: .5rem 0; padding-left: .75rem;
    border-left: 2px solid var(--rule); color: var(--muted);
  }

  .reveal { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .answer { margin-top: .75rem; font-size: .9375rem; }
  .answer p { margin: 0 0 .5rem; }
  .answer p:last-child { margin-bottom: 0; }
  .answer .evidence {
    display: block; width: 100%; height: auto; margin: .6rem 0;
    border: 1px solid var(--rule); border-radius: 2px;
  }
  /* 展开层：解密前整块不存在。只涂黑判定不够——理由和图片本身会指向答案 */
  .answer .more { display: none; }
  .reveal:checked ~ .answer .more { display: block; }
  .redact .w {
    background: var(--ink); color: transparent; border-radius: 1px;
    /* 文字仍在 DOM 里，只是看不见——禁掉选中，免得全选或长按把答案抹出来 */
    user-select: none; -webkit-user-select: none;
    transition: background-color .18s ease, color .18s ease;
  }
  .reveal:checked ~ .answer .redact .w {
    background: transparent; color: inherit;
    user-select: auto; -webkit-user-select: auto;
  }
  .reveal-btn {
    display: inline-block; margin-top: .75rem;
    padding: .3rem .8rem;
    border: 1px solid var(--ink); border-radius: 2px;
    font: 600 .75rem/1.6 var(--mono); letter-spacing: .08em;
    cursor: pointer; user-select: none;
  }
  .reveal-btn:hover { background: var(--ink); color: var(--paper-2); }
  .reveal:focus-visible ~ .reveal-btn { outline: 2px solid var(--signal); outline-offset: 2px; }
  .reveal:checked ~ .reveal-btn { display: none; }

  /* ── 页脚 ───────────────────────────── */
  .foot {
    margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-size: .875rem; color: var(--muted);
  }
  .foot p { margin: 0 0 .5rem; }
  .archive { font: 400 .75rem/2 var(--mono); }
  .archive a { color: var(--muted); text-decoration: none; margin-right: .6rem; }
  .archive a:hover { color: var(--signal); text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .redact .w { transition: none; }
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <h1 class="wordmark">DAILY RADAR</h1>
    <p class="issueline">№ {{ISSUE}}　·　{{DATE}}　·　PH 榜单日 {{PH_DAY}} (PT)</p>
    {{FAULT}}
  </header>

  <input type="radio" name="tab" id="tab-ph" class="tab-in" checked>
  <input type="radio" name="tab" id="tab-gh" class="tab-in">

  <nav class="tabs">
    <label for="tab-ph">Product Hunt <span class="n">1</span></label>
    <label for="tab-gh">GitHub Trending <span class="n">5</span></label>
  </nav>

  <section class="pane pane-ph">
    <p class="pane-head">先自己判断，再对答案。五到十分钟。</p>
    <div class="drill">
      <p class="sub">0 · 先看懂</p>
      {{PH_BRIEF}}
      <p class="sub">1 · 四问</p>
      {{PH_QUESTIONS}}
      {{SUNDAY_BLOCK}}
    </div>
    <p class="foot" style="margin-top:1.5rem;border:0;padding:0">判断完写一句预测，回复在飞书那条消息底下：<strong>「我认为它 6 个月后还在／死了，因为___」</strong>。30 天后往上翻，看命中率。</p>
  </section>

  <section class="pane pane-gh">
    <p class="pane-head">{{GH_SUMMARY}}</p>
    {{GITHUB_ROWS}}
  </section>

  <footer class="foot">
    <p class="archive">往期　{{ARCHIVE_LINKS}}</p>
  </footer>

</div>
</body>
</html>
